<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquiva Espacial 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
            z-index: 10;
        }
        #gameover-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
            display: none;
        }
        h1 {
            font-size: 50px;
            color: #ff3333;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background: #00ffcc;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #00cccc;
            transform: scale(1.05);
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 16px;
            z-index: 10;
        }
    </style>
    <!-- Importamos la librería Three.js desde internet -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="ui">PUNTOS: <span id="score">0</span></div>
    
    <div id="instructions">Usa las flechas Izquierda (←) y Derecha (→) o A / D para moverte</div>

    <div id="gameover-screen" id="gameOverScreen">
        <h1>¡NAVE DESTRUIDA!</h1>
        <p style="font-size: 20px; margin-bottom: 20px;">Puntuación final: <span id="final-score">0</span></p>
        <button onclick="restartGame()">REINTENTAR</button>
    </div>

    <script>
        // --- CONFIGURACIÓN ESCENA 3D ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.015); // Niebla espacial para dar profundidad

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- LUCES ---
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0x00ffff, 1);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // --- CREACIÓN DE LA NAVE (Jugador) ---
        const shipGeometry = new THREE.BoxGeometry(1.2, 0.6, 2);
        const shipMaterial = new THREE.MeshPhongMaterial({ color: 0x00ffcc, shininess: 100 });
        const playerShip = new THREE.Mesh(shipGeometry, shipMaterial);
        scene.add(playerShip);

        // Posición inicial de la cámara detrás de la nave
        camera.position.set(0, 3, 6);
        camera.lookAt(0, 0, -2);

        // --- VARIABLES DEL JUEGO ---
        let score = 0;
        let gameOver = false;
        let moveLeft = false;
        let moveRight = false;
        const playerSpeed = 0.15;
        const laneLimit = 4; // Límite lateral de la pista invisible

        let obstacles = [];
        let spawnTimer = 0;
        let gameSpeed = 0.4;

        // --- CONTROLES DE TECLADO ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = false;
        });

        // --- CREACIÓN DE ASTEROIDES ---
        function spawnObstacle() {
            const size = Math.random() * 0.8 + 0.5;
            const obstacleGeometry = new THREE.SphereGeometry(size, 8, 8);
            const obstacleMaterial = new THREE.MeshPhongMaterial({ color: 0xff5500, flatShining: true });
            const obstacle = new THREE.Mesh(obstacleGeometry, obstacleMaterial);
            
            // Aparecen al fondo de la pantalla en una posición X aleatoria
            obstacle.position.set(
                (Math.random() - 0.5) * (laneLimit * 2),
                0,
                -60
            );
            
            scene.add(obstacle);
            obstacles.push({ mesh: obstacle, radius: size });
        }

        // --- BUCLE PRINCIPAL DE ANIMACIÓN (60 FPS) ---
        function animate() {
            if (gameOver) return;

            requestAnimationFrame(animate);

            // Movimiento del jugador con límites en la pista
            if (moveLeft && playerShip.position.x > -laneLimit) playerShip.position.x -= playerSpeed;
            if (moveRight && playerShip.position.x < laneLimit) playerShip.position.x += playerSpeed;

            // Ligera inclinación visual de la nave al moverse
            if (moveLeft) playerShip.rotation.z = 0.3;
            else if (moveRight) playerShip.rotation.z = -0.3;
            else playerShip.rotation.z = 0;

            // Control de aparición de obstáculos
            spawnTimer++;
            if (spawnTimer > 15) { 
                spawnObstacle();
                spawnTimer = 0;
                score++;
                document.getElementById('score').innerText = score;
                // El juego se vuelve más rápido dinámicamente
                gameSpeed += 0.002; 
            }

            // Mover y procesar obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.mesh.position.z += gameSpeed;
                obs.mesh.rotation.x += 0.02; // Rotación de los asteroides

                // Detección de colisión (Fórmula matemática de distancia 3D)
                const diffX = playerShip.position.x - obs.mesh.position.x;
                const diffZ = playerShip.position.z - obs.mesh.position.z;
                const distance = Math.sqrt(diffX * diffX + diffZ * diffZ);

                // Si la distancia es menor que la suma de sus tamaños, chocan
                if (distance < (0.8 + obs.radius)) {
                    endGame();
                }

                // Borrar obstáculos viejos que ya pasaron de largo
                if (obs.mesh.position.z > 10) {
                    scene.remove(obs.mesh);
                    obstacles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // --- CONTROL DE FIN DE JUEGO ---
        function endGame() {
            gameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function restartGame() {
            // Limpiar la pantalla de asteroides viejos
            obstacles.forEach(obs => scene.remove(obs.mesh));
            obstacles = [];
            
            // Reiniciar variables
            score = 0;
            gameSpeed = 0.4;
            playerShip.position.set(0, 0, 0);
            document.getElementById('score').innerText = "0";
            document.getElementById('gameover-screen').style.display = 'none';
            gameOver = false;
            
            // Volver a arrancar el bucle
            animate();
        }

        // Ajustar la pantalla si el usuario cambia el tamaño del navegador
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Iniciar el juego automáticamente
        animate();
    </script>
</body>
</html>
